[package]
name = "raft_db"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
actix-cors = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
prost = "0.13"
tonic = "0.12"

[build-dependencies]
tonic-build = "0.12"
