syntax = "proto3";

package raftlog;

message Empty {}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  string command_json = 3;
}

message LogResponse {
  repeated LogEntry entries = 1;
}

message CommandRequest {
  string command_json = 1;
  uint64 term = 2;
}

message CommandResponse {
  bool success = 1;
  string message = 2;
}

service LogService {
  rpc GetLog(Empty) returns (LogResponse);
  rpc ApplyCommand(CommandRequest) returns (CommandResponse);
}

