syntax = "proto3";

package raftlog;

message Empty {}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  string command_json = 3;
}

message LogResponse {
  repeated LogEntry entries = 1;
}

message HeartbeatRequest {
  repeated LogEntry entries = 1;
  uint64 term = 2;
  string leader_id = 3;
}

message HeartbeatResponse {
  uint64 term = 1;
  bool accepted = 2;
  string leader_id = 3;
}

message VoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message VoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message CommandRequest {
  string command_json = 1;
  uint64 term = 2;
}

message CommandResponse {
  bool success = 1;
  string message = 2;
  uint64 term = 3;
}

service LogService {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc RequestVote(VoteRequest) returns (VoteResponse);
  rpc GetLog(Empty) returns (LogResponse);
  rpc ApplyCommand(CommandRequest) returns (CommandResponse);
  rpc ProposeCommand(CommandRequest) returns (CommandResponse);
}
